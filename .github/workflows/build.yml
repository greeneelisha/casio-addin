name: Build Casio Add-in

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            wget \
            cmake \
            make \
            python3 \
            python3-pip \
            python3-venv \
            python3-pil \
            build-essential \
            libpng-dev \
            libusb-1.0-0-dev \
            libudev-dev \
            libncurses-dev

      - name: Install GiteaPC
        run: |
          git clone https://git.planet-casio.com/Lephenixnoir/GiteaPC.git "$HOME/GiteaPC"
          cd "$HOME/GiteaPC"
          python3 giteapc.py --install

          echo "$HOME/GiteaPC" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check GiteaPC
        run: |
          command -v giteapc
          giteapc --help

      - name: Install Casio toolchain
        run: |
          giteapc install Lephenixnoir/sh-elf-binutils
          giteapc install Lephenixnoir/sh-elf-gcc
          giteapc install Lephenixnoir/OpenLibm
          giteapc install Lephenixnoir/fxlibc
          giteapc install Lephenixnoir/gint
          giteapc install Lephenixnoir/fxsdk

      - name: Build G1A
        run: |
          fxsdk build-fx

      - name: Find G1A
        run: |
          find . -type f -name "*.g1a" -print

      - name: Upload G1A
        uses: actions/upload-artifact@v4
        with:
          name: Casio-Addin
          path: "**/*.g1a"
          if-no-files-found: error
