name: Build Casio Add-in

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            wget \
            cmake \
            make \
            python3 \
            python3-pip \
            python3-venv \
            python3-pil \
            build-essential \
            pkg-config \
            libpng-dev \
            libusb-1.0-0-dev \
            libudev-dev \
            libncurses-dev

      - name: Install GiteaPC
        run: |
          git clone https://git.planet-casio.com/Lephenixnoir/GiteaPC.git "$HOME/GiteaPC"

          chmod +x "$HOME/GiteaPC/giteapc"

          echo "GiteaPC contents:"
          ls -la "$HOME/GiteaPC"

          echo "GiteaPC executable:"
          ls -l "$HOME/GiteaPC/giteapc"

      - name: Check GiteaPC
        run: |
          export GITEAPC="$HOME/GiteaPC/giteapc"

          echo "Testing GiteaPC:"
          "$GITEAPC" list

      - name: Install Casio toolchain
        run: |
          export GITEAPC="$HOME/GiteaPC/giteapc"

          "$GITEAPC" install -y \
            Lephenixnoir/fxsdk:noudisks2 \
            Lephenixnoir/sh-elf-binutils \
            Lephenixnoir/sh-elf-gcc \
            Lephenixnoir/OpenLibm \
            Vhex-Kernel-Core/fxlibc

          "$GITEAPC" install -y \
            Lephenixnoir/sh-elf-gcc

          "$GITEAPC" install -y \
            Lephenixnoir/gint

      - name: Add installed tools to PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          if [ -d "$HOME/.local/share/giteapc" ]; then
            find "$HOME/.local/share/giteapc" -type d -name bin -print
          fi

      - name: Check fxSDK
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          echo "Checking fxsdk:"
          which fxsdk
          fxsdk

      - name: Build G1A
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          fxsdk build-fx

      - name: Find G1A
        run: |
          echo "Searching for G1A files..."
          find . -type f -name "*.g1a" -print

      - name: Upload G1A
        uses: actions/upload-artifact@v4
        with:
          name: Casio-Addin
          path: "**/*.g1a"
          if-no-files-found: error
