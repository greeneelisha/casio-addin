name: Build Casio Add-in

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            wget \
            cmake \
            make \
            python3 \
            python3-pip \
            python3-venv \
            python3-pil \
            build-essential \
            pkg-config \
            libpng-dev \
            libusb-1.0-0-dev \
            libudev-dev \
            libncurses-dev \
            libudisks2-dev \
            udisks2

      - name: Download GiteaPC
        run: |
          git clone https://git.planet-casio.com/Lephenixnoir/GiteaPC.git "$HOME/GiteaPC"

          echo "GiteaPC downloaded successfully."
          echo "Repository contents:"
          ls -la "$HOME/GiteaPC"

      - name: Check GiteaPC
        run: |
          cd "$HOME/GiteaPC"

          echo "GiteaPC help:"
          python3 giteapc.py --help

      - name: Install Casio toolchain
        run: |
          cd "$HOME/GiteaPC"

          python3 giteapc.py install -y \
            Lephenixnoir/sh-elf-binutils \
            Lephenixnoir/sh-elf-gcc \
            Lephenixnoir/OpenLibm \
            Vhex-Kernel-Core/fxlibc \
            Lephenixnoir/gint \
            Lephenixnoir/fxsdk

      - name: Add installed tools to PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check fxSDK
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          echo "Looking for fxsdk..."

          if command -v fxsdk >/dev/null 2>&1; then
            echo "fxsdk found:"
            command -v fxsdk
            fxsdk --version || true
          else
            echo "fxsdk was not found."
            echo "Installed files:"
            find "$HOME/.local" -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi

      - name: Build G1A
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          fxsdk build-fx

      - name: Find G1A
        run: |
          echo "Searching for G1A files..."

          find . -type f -name "*.g1a" -print

      - name: Upload G1A
        uses: actions/upload-artifact@v4
        with:
          name: Casio-Addin
          path: "**/*.g1a"
          if-no-files-found: error
