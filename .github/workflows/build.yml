name: Build Casio Add-in

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            wget \
            cmake \
            make \
            python3 \
            python3-pip \
            python3-venv \
            python3-pil \
            build-essential \
            pkg-config \
            libpng-dev \
            libusb-1.0-0-dev \
            libudev-dev \
            libncurses-dev

      - name: Install GiteaPC
        run: |
          curl "https://git.planet-casio.com/Lephenixnoir/GiteaPC/raw/branch/master/install.sh" \
            -o /tmp/giteapc-install.sh

          bash /tmp/giteapc-install.sh

      - name: Locate GiteaPC
        run: |
          echo "HOME=$HOME"
          echo "PATH=$PATH"

          echo "Checking ~/.local/bin:"
          ls -la "$HOME/.local/bin" || true

          echo "Searching for giteapc:"
          find "$HOME/.local" -type f -name "giteapc" -print 2>/dev/null || true

          echo "Searching entire home directory:"
          find "$HOME" -type f -name "giteapc" -print 2>/dev/null || true

      - name: Check GiteaPC
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          if command -v giteapc >/dev/null 2>&1; then
            echo "GiteaPC found:"
            command -v giteapc
            giteapc list
          else
            echo "ERROR: GiteaPC was not found."
            echo "Contents of ~/.local:"
            find "$HOME/.local" -maxdepth 3 -type f -print 2>/dev/null || true
            exit 1
          fi

      - name: Install Casio toolchain
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          giteapc install -y \
            Lephenixnoir/fxsdk \
            Lephenixnoir/sh-elf-binutils \
            Lephenixnoir/sh-elf-gcc \
            Lephenixnoir/OpenLibm \
            Vhex-Kernel-Core/fxlibc \
            Lephenixnoir/gint

      - name: Build G1A
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          fxsdk build-fx

      - name: Find G1A
        run: |
          echo "Searching for G1A files..."
          find . -type f -name "*.g1a" -print

      - name: Upload G1A
        uses: actions/upload-artifact@v4
        with:
          name: Casio-Addin
          path: "**/*.g1a"
          if-no-files-found: error
