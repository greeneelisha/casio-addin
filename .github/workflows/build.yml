name: Build Casio Add-in

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            wget \
            cmake \
            make \
            python3 \
            python3-pip \
            python3-venv \
            python3-pil \
            build-essential \
            pkg-config \
            libpng-dev \
            libusb-1.0-0-dev \
            libudev-dev \
            libncurses-dev

      - name: Download GiteaPC
        run: |
          git clone https://git.planet-casio.com/Lephenixnoir/GiteaPC.git "$HOME/GiteaPC"

          echo "GiteaPC repository:"
          find "$HOME/GiteaPC" -maxdepth 2 -type f -print

      - name: Check GiteaPC files
        run: |
          echo "Top-level files:"
          ls -la "$HOME/GiteaPC"

          echo "GiteaPC directory:"
          ls -la "$HOME/GiteaPC/giteapc"

          echo "Python files:"
          find "$HOME/GiteaPC" -type f -name "*.py" -print

      - name: Run GiteaPC
        run: |
          cd "$HOME/GiteaPC"

          python3 giteapc.py list

      - name: Install Casio toolchain
        run: |
          cd "$HOME/GiteaPC"

          python3 giteapc.py install -y \
            Lephenixnoir/fxsdk:noudisks2 \
            Lephenixnoir/sh-elf-binutils \
            Lephenixnoir/sh-elf-gcc

      - name: Install libraries
        run: |
          cd "$HOME/GiteaPC"

          python3 giteapc.py install -y \
            Lephenixnoir/OpenLibm \
            Vhex-Kernel-Core/fxlibc

      - name: Rebuild GCC
        run: |
          cd "$HOME/GiteaPC"

          python3 giteapc.py install -y \
            Lephenixnoir/sh-elf-gcc

      - name: Install gint
        run: |
          cd "$HOME/GiteaPC"

          python3 giteapc.py install -y \
            Lephenixnoir/gint

      - name: Add GiteaPC tools to PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check fxSDK
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          echo "fxsdk location:"
          which fxsdk

          echo "fxsdk version:"
          fxsdk --version || true

      - name: Build G1A
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          fxsdk build-fx

      - name: Find G1A
        run: |
          echo "Searching for G1A files..."

          find . -type f -name "*.g1a" -print

      - name: Upload G1A
        uses: actions/upload-artifact@v4
        with:
          name: Casio-Addin
          path: "**/*.g1a"
          if-no-files-found: error
